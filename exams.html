<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الامتحانات |  Science Planner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Welcome student 🥰</h1>

    <p class="college-link">
      <a href="https://sci.cu.edu.eg/" target="_blank">
        كلية العلوم – جامعة القاهرة
      </a>
    </p>

    <nav>
      <a href="index.html">الرئيسية</a>
      <a href="lectures.html">المحاضرات</a>
      <a href="notes.html">الملاحظات</a>
      <a href="study.html">المذاكرة</a>
      <a href="exams.html">الامتحانات</a>
      <a href="settings.html">الإعدادات</a>
    </nav>
  </header>

  <main>

    <!-- أقرب امتحان -->
    <section class="card">
      <h2>أقرب امتحان 📅</h2>

      <div id="next-exam-card">
        <p>لا توجد امتحانات قادمة</p>
      </div>

      <p id="exam-countdown" class="countdown"></p>
    </section>

    <!-- جدول الامتحانات -->
    <section class="card">
      <h2>جدول الامتحانات</h2>

      <table id="exams-table">
        <thead>
          <tr>
            <th>المادة</th>
            <th>التاريخ</th>
            <th>الوقت</th>
            <th>حذف</th>
          </tr>
        </thead>
        <tbody>
          <!-- الصفوف ستضاف تلقائيًا -->
        </tbody>
      </table>

      <div class="form-group">
        <input type="text" id="exam-name" placeholder="اسم المادة">
        <input type="date" id="exam-date">
        <input type="time" id="exam-time">
        <button onclick="addExam()">➕ Add Exam</button>
      </div>
    </section>

  </main>

  <footer>
    <p>©eyad hamdy 2026</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
